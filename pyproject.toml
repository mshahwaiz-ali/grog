[project]
name = "grog"
version = "0.1.0"
description = "Offline XAUUSD Gold research and manual trading decision-support terminal (no broker execution)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.2.8",
]

[project.optional-dependencies]
desktop = ["pyside6-essentials==6.11.3"]

[project.scripts]
grog = "grog.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
